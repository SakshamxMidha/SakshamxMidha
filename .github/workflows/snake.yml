name: Generate Snake Animation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: SakshamxMidha
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark

      - name: Commit changes
        run: |
          git config --global user.name "SakshamxMidha"
          git config --global user.email "142732307+SakshamxMidha@users.noreply.github.com"
          git add profile/snake*.svg
          git commit -m "Update contribution snake animation" || echo "No changes"
          git pull --rebase
          git push
